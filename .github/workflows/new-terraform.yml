name: Terraform Plan and Apply

on:
  push:
    branches:
      - feature/*
      - main

  pull_request:
    branches:
      - main

jobs:
  Terraform_Plan:
    name: Terraform Plan Job
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Azure Login
        uses: Azure/login@v3.0.2
        with:
          client-id: 27a61f34-1ca2-4446-91ba-660d2381f25a
          # TenantId of the Azure Service principal created.
          tenant-id: bebf0fb6-edf2-4b8d-83c1-85a7083830e4
          # Azure subscriptionId
          subscription-id: 25e65bfa-14dd-466e-9f76-e0654ecde46a
   
      
      - name: HashiCorp - Setup Terraform
        uses: hashicorp/setup-terraform@v2.0.3
        with:
          terraform_version: latest
             
      - name: Terraform_init
        run: cd Environment/dev;terraform init

      - name: Terraform_validate
        run: terraform validate

      - name: Terraform_FMT_Check
        run: terraform fmt -check -recursive

      - name: Terraform_Plan
        run: cd Environment/dev;terraform Plan
